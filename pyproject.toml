[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pavas"
version = "0.1.0"
description = "Physics-Aware Video-to-Audio Synthesis built on MMAudio"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch==2.5.1",
  "huggingface_hub>=0.30,<1.0",
  "cython",
  "gitpython>=3.1",
  "tensorboard>=2.11",
  "numpy>=1.21,<2.1",
  "Pillow>=9.5",
  "opencv-python>=4.8",
  "imageio-ffmpeg>=0.6",
  "scipy>=1.7",
  "tqdm>=4.66.1",
  "einops>=0.6",
  "hydra-core>=1.3.2",
  "requests",
  "torchdiffeq>=0.2.5",
  "librosa>=0.8.1",
  "nitrous-ema",
  "hydra_colorlog",
  "tensordict>=0.6.1",
  "colorlog",
  "open_clip_torch>=2.29.0",
  "av>=14.0.1",
  "timm>=1.0.12",
  "matplotlib>=3.8",
  "torchcodec==0.1.1",
  "python-dotenv",
  "wandb>=0.17.0",
]

[tool.setuptools.packages.find]
where = ["pavas"]
