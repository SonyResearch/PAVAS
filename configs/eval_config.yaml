defaults:
  - base_config
  - override hydra/job_logging: custom-simplest
  - _self_

hydra:
  run:
    dir: ./output_eval/${exp_id}
  output_subdir: eval-${now:%Y-%m-%d_%H-%M-%S}-hydra

exp_id: ${model}
dataset: audiocaps
duration_s: 8.0
enable_grad_scaler: False
# for inference, this is the per-GPU batch size
batch_size: 16
output_name: null
checkpoint: null
clip_batch_size_multiplier: 8
sync_batch_size_multiplier: 8
